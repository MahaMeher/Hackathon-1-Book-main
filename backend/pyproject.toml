[project]
name = "backend"
version = "0.1.0"
description = "Book Content Ingestion Pipeline - Fetches content from Docusaurus books, generates embeddings, and stores in Qdrant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "cohere>=4.0.0",
    "qdrant-client>=1.7.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.8.0"
]
