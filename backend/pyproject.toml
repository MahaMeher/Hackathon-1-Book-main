[project]
name = "book-ingestion"
version = "0.1.0"
description = "Book Content Ingestion & Vector Indexing Pipeline"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "cohere>=5.0.0",
    "qdrant-client>=1.7.0",
    "python-dotenv>=1.0.0",
    "lxml>=4.9.0",
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
