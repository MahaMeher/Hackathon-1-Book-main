# =============================================================================
# docker-compose — Humanoid Robotics Academy (Frontend + Backend)
# =============================================================================
#
# Usage:
#   docker compose up -d          # Start both services in background
#   docker compose logs -f        # Follow logs
#   docker compose down           # Stop and remove containers
#
# Environment variables (create a .env file in the project root):
#   COHERE_API_KEY=your_key
#   QDRANT_URL=https://your-cluster.cloud.qdrant.io
#   QDRANT_API_KEY=your_key
#   COLLECTION_NAME=book_vectors
#
# The frontend will be available at http://localhost:3000
# The backend API at  http://localhost:8000/api/health

services:

  # ---------------------------------------------------------------------------
  # Backend — FastAPI RAG Chatbot
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hra-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - COLLECTION_NAME=${COLLECTION_NAME:-book_vectors}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Frontend — Docusaurus static site (served by nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./Frontend_book
      dockerfile: Dockerfile
    container_name: hra-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
