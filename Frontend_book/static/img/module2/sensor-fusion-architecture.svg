<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#fff8dc"/>
  <text x="400" y="80" font-family="Arial" font-size="24" text-anchor="middle" fill="#333">
    Sensor Fusion Architecture
  </text>
  <circle cx="150" cy="180" r="50" fill="#dda0dd" stroke="#000" stroke-width="2"/>
  <text x="150" y="185" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">LiDAR</text>
  <circle cx="350" cy="120" r="50" fill="#dda0dd" stroke="#000" stroke-width="2"/>
  <text x="350" y="125" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">Camera</text>
  <circle cx="350" cy="240" r="50" fill="#dda0dd" stroke="#000" stroke-width="2"/>
  <text x="350" y="245" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">IMU</text>
  <circle cx="600" cy="180" r="60" fill="#ffa500" stroke="#000" stroke-width="2"/>
  <text x="600" y="185" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">Fusion</text>
  <text x="600" y="200" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">Engine</text>
  <line x1="200" y1="180" x2="300" y2="120" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="180" x2="300" y2="240" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="120" x2="540" y2="160" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="240" x2="540" y2="200" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000" />
    </marker>
  </defs>
  <text x="400" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">
    Architecture showing fusion of LiDAR, Camera, and IMU sensor data
  </text>
</svg>
