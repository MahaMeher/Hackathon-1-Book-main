<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot body -->
  <rect x="60" y="60" width="80" height="80" rx="10" fill="#4F46E5" stroke="#3730A3" stroke-width="2"/>

  <!-- Robot head -->
  <rect x="75" y="30" width="50" height="40" rx="8" fill="#6366F1" stroke="#4F46E5" stroke-width="2"/>

  <!-- Eyes -->
  <circle cx="90" cy="50" r="5" fill="#E0E7FF"/>
  <circle cx="110" cy="50" r="5" fill="#E0E7FF"/>
  <circle cx="90" cy="50" r="2" fill="#1E1B4B"/>
  <circle cx="110" cy="50" r="2" fill="#1E1B4B"/>

  <!-- Antenna -->
  <line x1="100" y1="30" x2="100" y2="15" stroke="#4F46E5" stroke-width="3"/>
  <circle cx="100" cy="12" r="4" fill="#EC4899"/>

  <!-- Arms -->
  <rect x="40" y="70" width="20" height="10" rx="5" fill="#4F46E5"/>
  <rect x="140" y="70" width="20" height="10" rx="5" fill="#4F46E5"/>

  <!-- Legs -->
  <rect x="70" y="140" width="12" height="25" rx="3" fill="#4F46E5"/>
  <rect x="118" y="140" width="12" height="25" rx="3" fill="#4F46E5"/>

  <!-- AI circuit pattern -->
  <path d="M65 90 Q80 85 95 90 Q110 95 125 90" fill="none" stroke="#C7D2FE" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M65 100 Q80 95 95 100 Q110 105 125 100" fill="none" stroke="#C7D2FE" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M65 110 Q80 105 95 110 Q110 115 125 110" fill="none" stroke="#C7D2FE" stroke-width="2" stroke-dasharray="3,3"/>
</svg>